server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets Vite (fichiers hashés) : cache long terme
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Illustrations des cours.
    #
    # ⚠️ Elles sont servies **ici**, pas par Django. `config/urls.py` ne monte
    # la route `/media/` que si `DEBUG`, WhiteNoise ne couvre que `STATIC_ROOT`,
    # et `USE_S3` vaut `False` par défaut : sans ce bloc, les 31 figures des
    # chapitres HTML, CSS et JavaScript renvoient 404 en production.
    #
    # C'est légitime parce qu'il s'agit de contenu **versionné** et non de
    # téléversements : il n'existe aucun `ImageField` dans le projet, donc rien
    # n'écrit dans `media/` à l'exécution. Le répertoire est monté en lecture
    # seule par la compose de production.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA : toute route inconnue retombe sur index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
