<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Illustration de la leçon : structure de base d'une page HTML">
  <!--
    Leçon 2 — Structure de base d'une page HTML.

    Motif : l'imbrication. Un document contient une tête et un corps ; c'est
    tout le sujet de la leçon, et cela se dessine — deux blocs emboîtés dans un
    troisième, doublés à droite par l'arbre qu'ils forment.

    Codage couleur repris tel quel dans les deux moitiés de l'image, pour que
    le rapprochement se fasse sans légende : ambre pour la tête, violet pour le
    corps.

    Grammaire commune à la série (voir les autres fichiers de ce dossier) :
    même format, mêmes halos de fond, un objet central, des signes flottants.
    La dominante violette est celle du chapitre HTML.

    Aucune balise de texte : l'illustration ne dépend d'aucune police, donc
    rend à l'identique partout, y compris posée en image de fond.

    ATTENTION en modifiant ce cartouche : deux tirets consécutifs sont
    interdits dans un commentaire XML. Écrire les noms de variables CSS avec
    leur préfixe rend le fichier entier mal formé, et le navigateur n'affiche
    alors rien du tout, sans le moindre message.
  -->
  <defs>
    <linearGradient id="struct-fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f5fb"/>
      <stop offset="100%" stop-color="#e7e1fc"/>
    </linearGradient>
    <linearGradient id="struct-titre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b3df0"/>
      <stop offset="100%" stop-color="#8b6bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#struct-fond)"/>

  <!-- Masses de fond : ce sont elles qui portent l'image une fois floutée. -->
  <circle cx="965" cy="330" r="230" fill="#5b3df0" opacity="0.13"/>
  <circle cx="250" cy="600" r="180" fill="#f5a623" opacity="0.16"/>
  <circle cx="1090" cy="90" r="90" fill="#f5a623" opacity="0.20"/>

  <!-- Le document, et ce qu'il contient. -->
  <g transform="rotate(-3.5 450 340)">
    <rect x="130" y="115" width="640" height="450" rx="30" fill="#ffffff" stroke="#e3e0f0" stroke-width="3"/>

    <!-- La déclaration de type : une seule ligne, avant tout le reste. -->
    <rect x="178" y="145" width="186" height="22" rx="11" fill="#c9c2e6"/>

    <!-- La tête : courte, invisible à l'écran, faite de métadonnées. -->
    <rect x="178" y="190" width="544" height="112" rx="18" fill="#fef3dc" stroke="#f5a623" stroke-width="3"/>
    <g fill="#f5a623" opacity="0.75">
      <rect x="206" y="222" width="150" height="14" rx="7"/>
      <rect x="206" y="252" width="252" height="14" rx="7"/>
      <rect x="480" y="222" width="86" height="14" rx="7"/>
    </g>

    <!-- Le corps : tout ce que la page montre. -->
    <rect x="178" y="326" width="544" height="206" rx="18" fill="#efeafe" stroke="#5b3df0" stroke-width="3"/>
    <rect x="206" y="356" width="268" height="30" rx="10" fill="url(#struct-titre)"/>
    <g fill="#d5cdf5">
      <rect x="206" y="406" width="430" height="14" rx="7"/>
      <rect x="206" y="436" width="366" height="14" rx="7"/>
    </g>
    <rect x="206" y="470" width="118" height="40" rx="12" fill="#ffffff" stroke="#b9aef0" stroke-width="3"/>
    <rect x="344" y="470" width="118" height="40" rx="12" fill="#ffffff" stroke="#b9aef0" stroke-width="3"/>
  </g>

  <!-- Le même document, vu comme l'arbre qu'il est. Les couleurs répondent à
       celles des blocs de gauche. -->
  <g stroke="#4527d6" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M990 268 L990 310 M895 310 L1085 310 M895 310 L895 348 M1085 310 L1085 348"/>
    <path d="M1085 404 L1085 424 M1057 424 L1113 424 M1057 424 L1057 442 M1113 424 L1113 442"/>
  </g>

  <rect x="940" y="212" width="100" height="56" rx="18" fill="#4527d6"/>
  <rect x="845" y="348" width="100" height="56" rx="18" fill="#f5a623"/>
  <rect x="1035" y="348" width="100" height="56" rx="18" fill="#7c5cff"/>
  <rect x="1035" y="442" width="44" height="38" rx="12" fill="#b9aef0"/>
  <rect x="1091" y="442" width="44" height="38" rx="12" fill="#b9aef0"/>

  <!-- Quelques repères libres, pour le rythme. -->
  <rect x="828" y="530" width="52" height="52" rx="16" fill="#5b3df0" opacity="0.22"/>
  <rect x="906" y="560" width="32" height="32" rx="10" fill="#f5a623" opacity="0.5"/>
  <circle cx="1000" cy="556" r="15" fill="#5b3df0" opacity="0.3"/>
</svg>
