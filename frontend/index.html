<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icônes servies depuis `public/`, copié tel quel à la racine de `dist/`
      au build. Le chemin est absolu et n'est donc **pas** traité par le
      bundler : il lui faut une URL stable, ce que `public/` garantit.

      L'ancienne valeur pointait vers `/vite.svg`, absent du dépôt : le
      serveur répondait `index.html` par repli SPA, donc du HTML en guise
      d'image — un 200 qui masquait un favicon cassé.

      Le `.ico` embarque les tailles 16, 32 et 48 : un seul fichier pour tous
      les navigateurs. iOS l'ignore et exige un PNG, d'où `apple-touch-icon`.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#110D22" />
    <title>CodeAcademy — Apprenez à coder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
