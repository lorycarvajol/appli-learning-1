name: CI

# Deux déclencheurs seulement : ce qui part sur `main` et ce qui demande à y
# entrer. Lancer sur toutes les branches consommerait des minutes pour des
# commits de travail que personne ne relit.
on:
  push:
    branches: [main]
  pull_request:

# Une PR poussée trois fois de suite n'a pas besoin de trois exécutions :
# seule la dernière compte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django + pytest)
    runs-on: ubuntu-latest

    # `pytest.ini` fixe `--nomigrations` : le schéma de test est construit
    # directement depuis les modèles. C'est rapide, mais cela veut dire que la
    # suite ne touche jamais aux migrations — d'où l'étape dédiée plus bas.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Les services sont exposés sur l'hôte du runner, pas sur le réseau
      # Docker Compose : `postgres` / `redis` n'y résolvent pas.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: learning_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
      # `config/settings/__init__.py` bascule sur production dès que
      # ENVIRONMENT vaut « production » — et production refuse de démarrer sans
      # vraie SECRET_KEY. On reste donc explicitement en développement.
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Installer les dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Vérifier qu'aucune migration ne manque
        working-directory: backend
        # Un modèle modifié sans `makemigrations` passe toute la suite de tests
        # (grâce à `--nomigrations`) puis casse au déploiement. C'est le seul
        # endroit où ce décalage est détectable.
        run: python manage.py makemigrations --check --dry-run

      - name: Appliquer les migrations sur une base vierge
        working-directory: backend
        # Complément du point précédent : les migrations existent, mais rien ne
        # garantit qu'elles s'appliquent réellement dans l'ordre.
        run: python manage.py migrate

      - name: Contrôles Django
        working-directory: backend
        run: python manage.py check

      - name: Tests
        working-directory: backend
        # `--create-db` neutralise le `--reuse-db` de pytest.ini : sur un runner
        # neuf il n'y a rien à réutiliser, et le drapeau masquerait un schéma
        # périmé si le cache changeait un jour.
        run: pytest --create-db -q

  frontend:
    name: Frontend (ESLint + Vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # `--max-warnings 0` : les avertissements comptent comme des erreurs.
        # Le dépôt est à zéro, c'est le moment de verrouiller.
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        # Le build attrape ce que les tests ne voient pas : import cassé,
        # chemin dont la casse ne correspond pas (le runner est sensible à la
        # casse, contrairement au poste Windows de développement).
        run: npm run build
