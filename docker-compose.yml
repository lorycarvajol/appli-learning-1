services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: learning_platform_db
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: learning_platform_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  # Django Backend (WSGI - REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: learning_platform_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-4} --reload"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learning_network

  # ⚠️ Le service `daphne` a été retiré. Il servait `config.asgi:application`,
  # dont l'`URLRouter` est **vide** : aucun consumer WebSocket n'existe dans le
  # projet (cf. « WebSocket — RIEN N'EXISTE » dans CLAUDE.md). Il consommait
  # 72 Mo pour ne répondre à personne. À réintroduire — ici et dans
  # `docker-compose.prod.yml` — le jour où le temps réel existe vraiment.

  # Celery Worker (Async Tasks)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: learning_platform_celery
    command: celery -A config worker -l info -Q default,validation
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # Accès au daemon Docker pour le sandbox de validation
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
    networks:
      - learning_network

  # Celery Beat (Periodic Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: learning_platform_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
    networks:
      - learning_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: learning_platform_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - learning_network

  # Nginx Reverse Proxy (Optional - for production-like setup)
  # ⚠️ Le service `nginx` (profil `production`) a été retiré, avec son
  # `nginx/nginx.conf`. Il proxyfiait `/` vers le serveur **de développement**
  # Vite et `/media/` vers Django, qui ne sert pas les médias hors `DEBUG` :
  # il ne pouvait donc pas fonctionner en production. La vraie pile de
  # production est `docker-compose.prod.yml` — Traefik devant, et le nginx de
  # l'image front pour la SPA et les illustrations.
  #
  # Il publiait aussi le port 80, ce qui serait entré en collision frontale
  # avec le Traefik déjà en place sur le VPS.

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  learning_network:
    driver: bridge
