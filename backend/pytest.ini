[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --nomigrations
    -v
    -m "not docker"

markers =
    docker: exécute de vrais conteneurs. Nécessite l'accès au démon Docker,
        que seul le service `celery` possède (`/var/run/docker.sock` n'est pas
        monté sur `backend`). Exclus par défaut via `-m "not docker"` ; les
        lancer avec :
            docker-compose exec celery pytest apps/validation -m docker
