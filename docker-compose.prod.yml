# Pile de production — VPS mutualisé, derrière un Traefik déjà en place.
#
# Usage :
#   cp .env.production.example .env
#   $EDITOR .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# ─────────────────────────────────────────────────────────────────────────────
# Ce qui diffère du `docker-compose.yml` de développement, et pourquoi
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. **Aucun port publié.** La compose de développement publie 80, 5432, 6379,
#    8000, 8001 et 5173. Le 80 entrerait en collision frontale avec le Traefik
#    qui sert déjà l'autre projet ; les autres exposeraient PostgreSQL et Redis
#    sur l'hôte. Ici, seul Traefik atteint les services, par le réseau `proxy`.
#
# 2. **Deux réseaux.** `proxy` (externe, celui de Traefik) ne porte que les deux
#    services exposés. `internal` porte les données et n'est joignable par aucun
#    autre projet du VPS.
#
# 3. **`daphne` supprimé.** Il servait un `URLRouter` vide : aucun consumer
#    WebSocket n'existe (`config/asgi.py`). Le garder consommait 72 Mo pour
#    répondre à personne. À réintroduire le jour où le temps réel existe.
#
# 4. **Le worker n'a pas la socket Docker.** Il passe par un mandataire
#    (`docker-proxy`) qui n'ouvre que les routes nécessaires au bac à sable, sur
#    un réseau dédié et sans accès sortant. Voir le commentaire du service et
#    « Le bac à sable sur un hôte mutualisé » dans CLAUDE.md pour ce que cette
#    barrière protège — et ce qu'elle ne protège pas.
#
# 5. **Étages `production`**, sources non montées, pas de `--reload`.
#
# 6. **Journaux bornés.** Voir l'ancre `x-journaux` ci-dessous.

# ─────────────────────────────────────────────────────────────────────────────
# Rotation des journaux
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ Sans cette directive, le pilote `json-file` de Docker écrit **sans
# aucune limite**. Un journal qui grossit ne se voit pas : il ne ralentit
# rien, ne lève aucune alerte, et le jour où le disque est plein ce n'est pas
# ce projet qui tombe mais **tous ceux du VPS**, y compris leurs bases de
# données. C'est le mode de panne le plus discret d'un hôte mutualisé.
#
# 10 Mo × 3 fichiers, soit 30 Mo par conteneur au pire, 210 Mo pour la pile
# entière — négligeable sur 100 Go, et assez pour garder plusieurs jours
# d'historique à ce volume de trafic.
#
# ⚠️ Rotation ne veut pas dire archivage : au-delà de trois fichiers, les plus
# anciens sont **perdus**. Ce qui doit survivre à un incident passe par
# Sentry (`SENTRY_DSN`), pas par `docker logs`.
x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    <<: *journaux
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *journaux
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    <<: *journaux
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-4}"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # ⚠️ Priorité **supérieure** à celle du front, et surtout jamais égale.
      # Les deux routeurs répondent au même hôte. Mesuré sur une pile réelle :
      # à priorités égales, `/api/...` renvoie l'index.html de la SPA au lieu
      # du JSON. Sans priorité déclarée du tout, Traefik départage par longueur
      # de règle (95 contre 22) et l'API l'emporte — mais s'y fier est fragile,
      # c'est une propriété émergente : raccourcir cette règle inverserait le
      # résultat en silence.
      - "traefik.http.routers.learning-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/static`))"
      - "traefik.http.routers.learning-api.priority=100"
      - "traefik.http.routers.learning-api.entrypoints=websecure"
      - "traefik.http.routers.learning-api.tls.certresolver=${CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.learning-api.loadbalancer.server.port=8000"

  # Mandataire de la socket Docker.
  #
  # Le worker Celery a besoin de créer des conteneurs pour le bac à sable. Lui
  # monter `/var/run/docker.sock` lui donnerait **tout** le démon : `exec` dans
  # les conteneurs des autres projets du VPS, lecture des variables
  # d'environnement (donc des mots de passe), montage de n'importe quel chemin
  # de l'hôte. Ce mandataire n'expose que les routes strictement nécessaires.
  #
  # ⚠️ Ce qu'il ne fait **pas** : il filtre par route, pas par contenu de
  # requête. Quelqu'un qui obtiendrait l'exécution de code *dans le worker*
  # pourrait encore demander la création d'un conteneur privilégié montant `/`.
  # Il réduit la surface, il ne la supprime pas. La protection réelle contre ce
  # scénario est ailleurs : le code d'apprenant s'exécute dans un conteneur
  # sans réseau, qui ne peut donc pas joindre ce mandataire.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    restart: unless-stopped
    <<: *journaux
    environment:
      # Seul CONTAINERS est ouvert : create, start, wait, logs, kill, remove.
      CONTAINERS: 1
      POST: 1
      # Consultation des images (le SDK vérifie leur présence). Pas de build.
      IMAGES: 1
      # Tout le reste explicitement fermé — la valeur par défaut est déjà 0,
      # on l'écrit pour que l'intention soit lisible et qu'un ajout se remarque.
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      CONFIGS: 0
      SERVICES: 0
      SWARM: 0
      NODES: 0
      TASKS: 0
      PLUGINS: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Réseau dédié : seul le worker l'atteint. Ni le backend, ni le front,
      # ni les autres projets du VPS.
      - sandbox

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    <<: *journaux
    command: celery -A config worker -l info -Q default,validation
    env_file: .env
    environment:
      # ⚠️ Le worker ne monte **pas** la socket : il parle au mandataire par
      # TCP. C'est ce que lit `docker.from_env()` dans
      # `apps/validation/services.py`.
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - sandbox

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    <<: *journaux
    command: celery -A config beat -l info
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Figée dans le bundle à la construction — cf. le commentaire du
        # Dockerfile. Changer cette valeur impose de reconstruire l'image.
        VITE_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    <<: *journaux
    volumes:
      # Illustrations des cours, servies par nginx (cf. frontend/nginx.conf).
      # En lecture seule : ce sont des fichiers versionnés, rien ne doit y
      # écrire à l'exécution.
      - ./backend/media:/usr/share/nginx/media:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.learning-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.learning-web.priority=1"
      - "traefik.http.routers.learning-web.entrypoints=websecure"
      - "traefik.http.routers.learning-web.tls.certresolver=${CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.learning-web.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:

networks:
  # Créé par la pile Traefik existante : `docker network create proxy`.
  proxy:
    external: true
  internal:
    driver: bridge
  # Isole le mandataire de socket : seul le worker y a pied. `internal: true`
  # coupe aussi tout accès sortant, ce qui n'a aucun coût ici et retire une
  # voie d'exfiltration si le mandataire était un jour compromis.
  sandbox:
    driver: bridge
    internal: true
